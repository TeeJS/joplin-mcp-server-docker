[project]
name = "joplin-mcp"
version = "0.1.0"
description = "Joplin MCP Server - A Model Context Protocol Server for Joplin"
authors = [
    { name = "David Weigend", email = "contact@weigend.studio" }
]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["joplin", "mcp", "note-taking", "ai", "claude"]
homepage = "https://weigend.studio"
repository = "https://github.com/dweigend/joplin-mcp"
dependencies = [
    # Upper bound is load-bearing, not caution: mcp 2.0 removed
    # mcp.server.fastmcp, which this server is built on. Unpinned, the next
    # image build resolves to 2.x and crashes on import.
    "mcp[cli]>=1.28.1,<2",
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
    "requests>=2.32,<3",
    "pydantic>=2.10,<3",
    "starlette>=0.45,<1",
    "uvicorn>=0.34,<1",
    # Resource-server JWT validation. The crypto extra supplies the RSA/EC
    # backends; without it PyJWT cannot verify RS256 at all.
    "pyjwt[crypto]>=2.8,<3",
    # Semantic search. onnxruntime rather than torch: the model is the same
    # quantized MiniLM the knowledge-graph plugin bundles, and this keeps the
    # install to tens of megabytes instead of a gigabyte. Required rather than
    # optional because the launcher runs a plain `uv sync`, which would prune
    # an extra on every restart.
    "numpy>=1.24",
    # Capped at <1.24 upstream because 1.24+ dropped x86_64 macOS wheels; the
    # cap is harmless on the Linux container and keeps parity with upstream.
    "onnxruntime>=1.17,<1.24",
    "tokenizers>=0.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "black>=24.1.1",
    "mypy>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/joplin"]

[tool.ruff]
line-length = 130
select = [
    "F",     # Pyflakes (Syntax + Basic Errors)
    "E",     # Pycodestyle Errors
    "W",     # Pycodestyle Warnings
    "I",     # isort
    "UP",    # pyupgrade (Modern Python Features)
    "RUF",   # Ruff-specific
]
ignore = ["D203", "D213"]

[tool.ruff.pydocstyle]
convention = "google"
