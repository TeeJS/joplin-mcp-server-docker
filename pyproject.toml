[project]
name = "joplin-mcp"
version = "0.1.0"
description = "Joplin MCP Server - A Model Context Protocol Server for Joplin"
authors = [
    { name = "David Weigend", email = "contact@weigend.studio" }
]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["joplin", "mcp", "note-taking", "ai", "claude"]
homepage = "https://weigend.studio"
repository = "https://github.com/dweigend/joplin-mcp"
dependencies = [
    # Pinned: FastMCP tool-schema behavior changes between minor releases
    # (1.x stopped flattening single pydantic-model args). Keep within a known
    # -good minor so `uv sync`/`uv lock` stay deterministic; bump deliberately.
    "mcp[cli]>=1.26.0,<1.27.0",
    "httpx",
    "python-dotenv",
    "requests",
    "pydantic",
    "uvicorn>=0.34.0",
    # Semantic search. onnxruntime rather than torch: the model is the same
    # quantized MiniLM the knowledge-graph plugin bundles, and this keeps the
    # install to tens of megabytes instead of a gigabyte. Required rather than
    # optional because the launcher runs a plain `uv sync`, which would prune
    # an extra on every restart.
    "numpy>=1.24",
    # Capped: 1.24+ dropped x86_64 macOS wheels, and this runs on an Intel Mac.
    "onnxruntime>=1.17,<1.24",
    "tokenizers>=0.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "black>=24.1.1",
    "mypy>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/joplin"]

[tool.ruff]
line-length = 130
select = [
    "F",     # Pyflakes (Syntax + Basic Errors)
    "E",     # Pycodestyle Errors
    "W",     # Pycodestyle Warnings
    "I",     # isort
    "UP",    # pyupgrade (Modern Python Features)
    "RUF",   # Ruff-specific
]
ignore = ["D203", "D213"]

[tool.ruff.pydocstyle]
convention = "google"
